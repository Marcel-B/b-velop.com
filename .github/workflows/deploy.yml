name: Deploy zu STRATO

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Host-Key von STRATO holen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts

      - name: Dateien per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.STRATO_REMOTE_DIR }}
        run: |
          # Leerzeichen und Zeilenumbrüche aus eingefügten Secrets entfernen
          SFTP_HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]')"
          SFTP_USER="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"
          REMOTE_DIR="$(printf '%s' "$REMOTE_DIR" | tr -d '\r\n')"
          export LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          lftp -e "
            set sftp:auto-confirm no;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u $SFTP_USER sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vscode/ \
              --exclude-glob .gitignore \
              --exclude-glob README.md \
              . ${REMOTE_DIR:-/};
            bye
          "
